name: WinUI3 Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target project. This template repo never builds MSIX.'
        required: false
        default: 'main'

permissions:
  contents: write

env:
  DEFAULT_BRANCH: main
  CONFIGURATION: Release
  PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Restore
        run: dotnet restore TypeForge.sln

      - name: Test Core
        run: dotnet test tests/TypeForge.Tests/TypeForge.Tests.csproj -c Release --no-restore

      - name: Publish Self-Contained WinUI3 App (win-x64)
        run: |
          dotnet publish src/TypeForge.App/TypeForge.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o dist/TypeForge-win-x64

      - name: Download Prior Velopack Releases for Delta Generation
        shell: bash
        run: |
          mkdir -p bin/Dist
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --outputDir "bin/Dist" || true

      - name: Package Windows Setup Installer & Delta Feed (Velopack)
        shell: pwsh
        run: |
          $version = Get-Content VERSION -Raw | ForEach-Object { $_.Trim() }
          New-Item -ItemType Directory -Force -Path bin/Dist | Out-Null
          $packArgs = @(
            'pack',
            '--packId', 'TypeForgeApp',
            '--packTitle', 'TypeForge',
            '--packAuthors', 'TypeForge',
            '--packVersion', $version,
            '--runtime', 'win-x64',
            '--packDir', 'dist/TypeForge-win-x64',
            '--mainExe', 'TypeForge.App.exe',
            '--icon', 'src/TypeForge.App/Assets/AppIcon.ico',
            '--splashProgressColor', '#A78BFA',
            '--outputDir', 'bin/Dist'
          )
          if (Test-Path 'release_notes.md') {
            $packArgs += @('--releaseNotes', 'release_notes.md')
          }
          vpk @packArgs

      - name: Ensure GitHub Release Exists and Upload Installer + Update Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "${{ github.event.repository.name }} v${VERSION}" --generate-notes
          fi
          shopt -s nullglob
          ASSETS=(bin/Dist/*)
          if [ ${#ASSETS[@]} -gt 0 ]; then
            gh release upload "v${VERSION}" "${ASSETS[@]}" --clobber
          fi

      - name: Update version.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION | tr -d '[:space:]')
          SETUP_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/TypeForgeApp-win-Setup.exe"
          cat > version.json <<EOF
          {
            "name": "${{ github.event.repository.name }}",
            "version": "${VERSION}",
            "channel": "stable",
            "download_url": "${SETUP_URL}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update version.json for WinUI3 release v${VERSION} [skip ci]" || true
          git push origin "${{ env.DEFAULT_BRANCH }}"
      - name: Debug build artifacts
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== Dist ==="
          Get-ChildItem "bin/Dist" -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Write-Host "=== VERSION ==="
          Get-Content VERSION -ErrorAction SilentlyContinue
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: winui3-debug
          path: bin/Dist/
