name: WinUI3 Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target project. This template repo never builds MSIX.'
        required: false
        default: 'main'

permissions:
  contents: write

env:
  DEFAULT_BRANCH: main
  CONFIGURATION: Release
  PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TypeForge.sln

      - name: Test Core
        run: dotnet test tests/TypeForge.Tests/TypeForge.Tests.csproj -c Release --no-restore

      - name: Publish Self-Contained WinUI3 App (win-x64)
        run: |
          dotnet publish src/TypeForge.App/TypeForge.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o dist/TypeForge-win-x64

      - name: Package Portable Archive
        shell: pwsh
        run: |
          $version = Get-Content VERSION -Raw | ForEach-Object { $_.Trim() }
          New-Item -ItemType Directory -Force -Path bin/Dist | Out-Null
          Compress-Archive -Path "dist/TypeForge-win-x64/*" -DestinationPath "bin/Dist/TypeForge-v$version-win-x64.zip" -Force

      - name: Ensure GitHub Release Exists and Upload Binary Archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "${{ github.event.repository.name }} v${VERSION}" --generate-notes
          fi
          gh release upload "v${VERSION}" "bin/Dist/TypeForge-v${VERSION}-win-x64.zip" --clobber

      - name: Update version.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION | tr -d '[:space:]')
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/TypeForge-v${VERSION}-win-x64.zip"
          cat > version.json <<EOF
          {
            "name": "${{ github.event.repository.name }}",
            "version": "${VERSION}",
            "channel": "stable",
            "download_url": "${ZIP_URL}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update version.json for WinUI3 release v${VERSION} [skip ci]" || true
          git push origin "${{ env.DEFAULT_BRANCH }}"
      - name: Debug build artifacts
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== Dist ==="
          Get-ChildItem "bin/Dist" -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Write-Host "=== VERSION ==="
          Get-Content VERSION -ErrorAction SilentlyContinue
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: winui3-debug
          path: bin/Dist/
