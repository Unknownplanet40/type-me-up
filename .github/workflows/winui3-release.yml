name: WinUI3 Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target project. This template repo never builds MSIX.'
        required: false
        default: 'main'

permissions:
  contents: write

env:
  DEFAULT_BRANCH: main
  CONFIGURATION: Release
  PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TypeForge.sln

      - name: Test Core
        run: dotnet test tests/TypeForge.Tests/TypeForge.Tests.csproj -c Release --no-restore

      - name: Publish Self-Contained WinUI3 App (win-x64)
        run: |
          dotnet publish src/TypeForge.App/TypeForge.App.csproj -c Release -p:PublishProfile=win-x64

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          $publishPath = "src/TypeForge.App/bin/Release/net8.0-windows10.0.26100.0/win-x64/publish"
          Compress-Archive -Path "$publishPath/*" -DestinationPath "TypeForge-win-x64.zip" -Force

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $version = Get-Content VERSION -Raw | ForEach-Object { $_.Trim() }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer/TypeForge.iss

      - name: Ensure GitHub Release Exists and Upload Installer + Portable ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "${{ github.event.repository.name }} v${VERSION}" --generate-notes
          fi
          gh release upload "v${VERSION}" "installer/TypeForge-Setup-win-x64.exe" "TypeForge-win-x64.zip" --clobber

      - name: Update version.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION | tr -d '[:space:]')
          SETUP_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/TypeForge-Setup-win-x64.exe"
          cat > version.json <<EOF
          {
            "name": "${{ github.event.repository.name }}",
            "version": "${VERSION}",
            "channel": "stable",
            "download_url": "${SETUP_URL}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update version.json for WinUI3 release v${VERSION} [skip ci]" || true
          git push origin "${{ env.DEFAULT_BRANCH }}"
      - name: Debug build artifacts
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "installer" -File -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Get-Content VERSION -ErrorAction SilentlyContinue
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: winui3-debug
          path: installer/
