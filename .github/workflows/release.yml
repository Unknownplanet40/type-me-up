name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Target project (branch, repo, or commit). Template repo itself never triggers a release.'
        required: false
        default: 'main'
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
env:
  DEFAULT_BRANCH: main
jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}
      - id: changelog
        shell: bash
        run: |
          set -euo pipefail
          LAST_TAG=$(git tag --sort=-creatordate | head -n1 || true)
          LAST_VERSION="${LAST_TAG#v}"
          [ -z "$LAST_VERSION" ] && LAST_VERSION="0.0.0"
          RANGE="HEAD"
          [ -n "$LAST_TAG" ] && RANGE="${LAST_TAG}..HEAD"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "last_version=$LAST_VERSION" >> "$GITHUB_OUTPUT"
          python3 - "$RANGE" <<'PY'
          import os, re, subprocess, sys

          def log(msg):
              print(f"[changelog] {msg}", file=sys.stderr)

          range_spec = sys.argv[1]
          log(f"range: {range_spec}")
          log_out = subprocess.run(["git", "log", "--pretty=format:%H%x1f%s%x1f%b%x1e", range_spec], capture_output=True, text=True, check=True).stdout
          commits = [c for c in log_out.split("\x1e") if c.strip()]
          log(f"commits found: {len(commits)}")
          type_map = {"feat": "Added", "fix": "Fixed", "perf": "Performance", "revert": "Removed"}
          categories = ["Added", "Changed", "Fixed", "Removed", "Performance", "Security", "Breaking Changes"]
          sections = {k: [] for k in categories}
          canon = {k.lower(): k for k in categories}
          conv_re = re.compile(r'^(?P<type>\w+)(\((?P<scope>[^)]+)\))?(?P<breaking>!)?:\s*(?P<desc>.+)$')
          heading_re = re.compile(r'^\s{0,3}#{1,4}\s*(Summary|Added|Changed|Fixed|Removed|Performance|Security|Breaking Changes)\s*$', re.IGNORECASE)
          bullet_re = re.compile(r'^\s*[-*]\s+(.*\S)\s*$')
          bump = "none"
          for c in commits:
              parts = c.split("\x1f")
              if len(parts) < 2: continue
              sha = parts[0].strip()[:7]
              subject = parts[1].strip()
              body = parts[2] if len(parts) > 2 else ""
              m = conv_re.match(subject)
              is_breaking = bool(m and m.group("breaking")) or "BREAKING CHANGE" in body
              if is_breaking: bump = "major"
              elif bump != "major" and m and m.group("type") == "feat": bump = "minor"
              elif bump not in ("major", "minor") and m and m.group("type") == "fix": bump = "patch"
              structured = {k: [] for k in categories}
              current = None
              for raw_line in body.splitlines():
                  h = heading_re.match(raw_line)
                  if h: current = canon.get(h.group(1).lower()); continue
                  b = bullet_re.match(raw_line)
                  if b and current: structured[current].append(f"- {b.group(1)} ({sha})")
              if any(structured[k] for k in categories):
                  for k in categories: sections[k].extend(structured[k])
                  continue
              if not m: continue
              scope = (m.group("scope") or "").lower()
              entry = f"- {m.group('desc').strip()} ({sha})"
              if is_breaking: sections["Breaking Changes"].append(entry)
              if "security" in scope: sections["Security"].append(entry)
              else: sections[type_map.get(m.group("type"), "Changed")].append(entry)
          lines = []
          for name in categories:
              if sections[name]: lines.append(f"### {name}"); lines.extend(sections[name]); lines.append("")
          log(f"sections with entries: {[n for n in categories if sections[n]]}")
          log(f"bump: {bump}")
          with open("changelog_body.txt", "w") as f:
              f.write("\n".join(lines).strip() + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"bump={bump}\n")
          PY
      - if: steps.changelog.outputs.bump != 'none'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          IFS='.' read -r major minor patch <<< "${{ steps.changelog.outputs.last_version }}"
          case "${{ steps.changelog.outputs.bump }}" in
            major) NEW_VERSION="$((major+1)).0.0" ;;
            minor) NEW_VERSION="$major.$((minor+1)).0" ;;
            patch) NEW_VERSION="$major.$minor.$((patch+1))" ;;
          esac
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "$NEW_VERSION" > VERSION
      - if: steps.changelog.outputs.bump != 'none'
        shell: bash
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          DATE=$(date +%Y-%m-%d)
          BODY=$(cat changelog_body.txt)
          # Build CHANGELOG.md entry (history) from release notes (latest only)
          {
            echo "## [$NEW_VERSION] - $DATE"
            echo ""
            echo "$BODY"
          } > release_notes.md
          if [ -f CHANGELOG.md ]; then
            # Prepend: keep header, insert new entry after ## [Unreleased] or at top
            if grep -q "^## \[Unreleased\]" CHANGELOG.md; then
              awk -v entry="$(cat release_notes.md)" '/^## \[Unreleased\]/{print; print ""; print entry; next}1' CHANGELOG.md > tmp.md && mv tmp.md CHANGELOG.md
            else
              {
                echo "# Changelog"
                echo ""
                echo "## [Unreleased]"
                echo ""
                cat release_notes.md
                echo ""
                tail -n +2 CHANGELOG.md 2>/dev/null || true
              } > tmp.md && mv tmp.md CHANGELOG.md
            fi
          else
            {
              echo "# Changelog"
              echo ""
              echo "All notable changes to this project are documented here."
              echo ""
              echo "## [Unreleased]"
              echo ""
              cat release_notes.md
            } > CHANGELOG.md
          fi
      - if: steps.changelog.outputs.bump != 'none'
        shell: bash
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin "${{ env.DEFAULT_BRANCH }}"
          git push origin "v${NEW_VERSION}"
          gh release create "v${NEW_VERSION}" --title "${{ github.event.repository.name }} v${NEW_VERSION}" --notes-file release_notes.md
          gh release upload "v${NEW_VERSION}" CHANGELOG.md --clobber || true
          gh release upload "v${NEW_VERSION}" release_notes.md --clobber || true
          URL="https://github.com/${{ github.repository }}/releases/download/v${NEW_VERSION}/${{ github.event.repository.name }}-${NEW_VERSION}.zip"
          cat > version.json <<EOF
          {
            "name": "${{ github.event.repository.name }}",
            "version": "${NEW_VERSION}",
            "channel": "stable",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/v${NEW_VERSION}/TypeForge-Setup-win-x64.exe"
          }
          EOF
          git add version.json
          git commit -m "chore: point version.json at release v${NEW_VERSION} [skip ci]" || true
          git push origin "${{ env.DEFAULT_BRANCH }}"
      - name: Debug release notes
        if: failure()
        shell: bash
        run: |
          echo "=== release_notes.md ==="
          cat release_notes.md || echo "(no release_notes.md)"
          echo "=== CHANGELOG.md head ==="
          head -n 30 CHANGELOG.md || echo "(no CHANGELOG.md)"
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-debug
          path: |
            release_notes.md
            CHANGELOG.md
            changelog_body.txt

  publish-installer:
    needs: release
    if: needs.release.outputs.new_version != ''
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_version }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore & Test Core
        run: |
          dotnet restore TypeForge.sln
          dotnet test tests/TypeForge.Tests/TypeForge.Tests.csproj -c Release --no-restore

      - name: Publish Self-Contained WinUI3 App (win-x64)
        run: |
          dotnet publish src/TypeForge.App/TypeForge.App.csproj -c Release -p:PublishProfile=win-x64

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          $publishPath = "src/TypeForge.App/bin/Release/net8.0-windows10.0.26100.0/win-x64/publish"
          Compress-Archive -Path "$publishPath/*" -DestinationPath "TypeForge-win-x64.zip" -Force

      - name: Build Inno Setup Installer
        shell: pwsh
        env:
          NEW_VERSION: ${{ needs.release.outputs.new_version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:NEW_VERSION" installer/TypeForge.iss

      - name: Upload Installer & Portable ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.release.outputs.new_version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "v${NEW_VERSION}" "installer/TypeForge-Setup-win-x64.exe" "TypeForge-win-x64.zip" --clobber
