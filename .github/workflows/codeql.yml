name: CodeQL

on:
  workflow_dispatch:
    # Manual trigger. Enable push/pull_request only when repository is public or has GitHub Advanced Security enabled.

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
