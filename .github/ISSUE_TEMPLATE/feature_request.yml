name: Feature Request
description: Suggest an idea or enhancement for this project.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a great idea or feature request? We'd love to hear about it!
  - type: input
    id: persona
    attributes:
      label: Persona / Target Audience
      description: Who will use this feature and what is their role?
      placeholder: e.g. End User, Administrator, Developer
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component Area
      description: Which area or subsystem does this feature request impact?
      options:
        - UI / UX / Layout
        - Domain Logic & Workflow
        - Data Persistence & Storage
        - Authentication & Security
        - Installer & Auto-Update
        - CI/CD & Build Tooling
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when [...]
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List specific criteria that define this feature as complete.
      placeholder: |
        - [ ] User can perform action X
        - [ ] Input Y is validated
        - [ ] System handles edge case Z
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority / Business Value
      description: How critical is this feature request?
      options:
        - Low (Nice to have)
        - Medium (Important enhancement)
        - High (Blocks core adoption or critical workflow)
    validations:
      required: false
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request for this feature.
          required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false
